[defaults]
inventory = ../infra/envs/dev/generated/inventory.ini
host_key_checking = False
forks = 10
timeout = 30
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
