# ---------- Phiên bản (Kiểm tra và chuẩn hóa cho K8s 1.31) ----------
k8s_minor: "1.31"
containerd_version: "1.7.23"
runc_version: "1.1.14"
cni_plugins_version: "1.5.1"
calico_version: "v3.28.2"
helm_version: "v3.16.4"
metrics_server_chart_version: "3.12.1"
gateway_api_version: "v1.1.0"
traefik_chart_version: "31.1.1"

# ---------- Docker Hub Registry ----------
docker_hub_user: "ducthinhahihi"

# ---------- Mạng của cụm (không được trùng VPC 10.0.0.0/16) ----------
pod_cidr: "192.168.0.0/16"
service_cidr: "10.96.0.0/12"

# ---------- NodePort của Ingress & ArgoCD, khớp target group NLB trong Terraform ----------
ingress_http_node_port: 30080
ingress_https_node_port: 30443
ingress_argocd_node_port: 30085

# ---------- Khác ----------
kubeconfig_admin: /etc/kubernetes/admin.conf
local_kubeconfig: "{{ playbook_dir }}/generated/kubeconfig"
