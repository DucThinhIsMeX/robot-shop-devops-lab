# Gỡ cụm để dựng lại từ đầu mà không cần destroy hạ tầng.
# Chạy: ansible-playbook reset.yml
- name: Gỡ Kubernetes khỏi mọi node
  hosts: k8s_cluster
  become: true
  tasks:
    - name: Chạy kubeadm reset
      ansible.builtin.command: kubeadm reset -f
      changed_when: true
      failed_when: false

    - name: Xóa cấu hình CNI và kubeconfig cũ
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/cni/net.d
        - "/home/{{ ansible_user }}/.kube"

    - name: Khởi động lại containerd
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted
