name: Enterprise CI/CD Pipeline - Robot Shop (5 Stages)

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # STAGE 1: CODE QUALITY & LINTING
  # Kiểm tra tính đúng đắn của mã nguồn, cú pháp shell script và Dockerfile
  # =========================================================================
  stage-1-code-quality:
    name: "1. Code Quality & Lint"
    runs-on: ubuntu-latest
    steps:
      - name: 1.1. Checkout Code
        uses: actions/checkout@v4

      - name: 1.2. Shell Script Syntax Check
        run: |
          echo "Kiểm tra cú pháp file entrypoint.sh..."
          bash -n web/entrypoint.sh
          echo " entrypoint.sh cú pháp hợp lệ!"

      - name: 1.3. Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./web/Dockerfile
          failure-threshold: error
          ignore: DL3008,DL3018,DL3015

  # =========================================================================
  # STAGE 2: SECURITY & VULNERABILITY SCAN (DevSecOps)
  # Rà quét lỗ hổng bảo mật mã nguồn và cấu hình bằng Trivy
  # =========================================================================
  stage-2-security-scan:
    name: "2. Security Scan (DevSecOps)"
    needs: [ stage-1-code-quality ]
    runs-on: ubuntu-latest
    steps:
      - name: 2.1. Checkout Code
        uses: actions/checkout@v4

      - name: 2.2. Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './web'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # =========================================================================
  # STAGE 3: DOCKER BUILD & COMPILATION
  # Đóng gói ứng dụng thành Docker Image với nhãn Git Short SHA
  # =========================================================================
  stage-3-docker-build:
    name: "3. Build Docker Image"
    needs: [ stage-2-security-scan ]
    runs-on: ubuntu-latest
    steps:
      - name: 3.1. Checkout Code
        uses: actions/checkout@v4

      - name: 3.2. Set Git Short SHA
        run: echo "SHA_SHORT=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV

      - name: 3.3. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3.4. Build Local Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rs-web:${{ env.SHA_SHORT }}

  # =========================================================================
  # STAGE 4: PUBLISH TO REGISTRY (Docker Hub)
  # Đăng nhập an toàn và phát hành image lên Docker Hub công khai
  # =========================================================================
  stage-4-docker-publish:
    name: "4. Publish to Docker Hub"
    needs: [ stage-3-docker-build ]
    runs-on: ubuntu-latest
    steps:
      - name: 4.1. Checkout Code
        uses: actions/checkout@v4

      - name: 4.2. Set Git Short SHA
        run: echo "SHA_SHORT=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV

      - name: 4.3. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 4.4. Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 4.5. Push Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rs-web:${{ env.SHA_SHORT }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rs-web:latest

  # =========================================================================
  # STAGE 5: GITOPS HANDOFF & AUTO-SYNC
  # Tự động cập nhật file Kubernetes Manifest và bàn giao cho ArgoCD
  # =========================================================================
  stage-5-gitops-handoff:
    name: "5. GitOps Handoff"
    needs: [ stage-4-docker-publish ]
    runs-on: ubuntu-latest
    steps:
      - name: 5.1. Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 5.2. Set Git Short SHA
        run: echo "SHA_SHORT=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV

      - name: 5.3. Update K8s Manifest Image Tag
        run: |
          sed -i "s|image: .*rs-web:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/rs-web:${{ env.SHA_SHORT }}|g" K8s/04-gateway/web.yaml
          echo "Đã cập nhật K8s/04-gateway/web.yaml trỏ về tag: ${{ env.SHA_SHORT }}"

      - name: 5.4. Commit & Push Updated Manifest (GitOps Trigger)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add K8s/04-gateway/web.yaml
          if git diff --staged --quiet; then
            echo "Không có thay đổi trong manifest."
          else
            git commit -m "chore(gitops): auto-update web image to ${{ env.SHA_SHORT }} [skip ci]"
            git push origin main
            echo " Đã commit & push GitOps manifest! ArgoCD sẽ tự động đồng bộ."
          fi
