name: Enterprise CI/CD GitOps Pipeline - Stan's Robot Shop

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'catalogue/**'
      - 'cart/**'
      - 'user/**'
      - 'shipping/**'
      - 'payment/**'
      - 'ratings/**'
      - 'dispatch/**'
      - 'mongo/**'
      - 'mysql/**'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Chọn dịch vụ cần build & deploy (hoặc chọn "all")'
        required: true
        default: 'web'
        type: choice
        options:
          - web
          - cart
          - catalogue
          - user
          - shipping
          - payment
          - ratings
          - dispatch
          - mongo
          - mysql
          - all

permissions:
  contents: write

jobs:
  # =========================================================================
  # PHẦN 1: PHÁT HIỆN DỊCH VỤ THAY ĐỔI (INTELLIGENT CHANGE DETECTION)
  # Chỉ kích hoạt pipeline cho các microservices thực sự có thay đổi mã nguồn
  # =========================================================================
  detect-changes:
    name: "🔍 1. Phát hiện Dịch vụ Thay đổi"
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.filter.outputs.has_changes }}
      services: ${{ steps.filter.outputs.services }}
    steps:
      - name: 1.1. Checkout Code (Fetch History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 1.2. Phân tích đường dẫn thay đổi
        id: filter
        run: |
          # Trường hợp kích hoạt thủ công (workflow_dispatch)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SELECTED="${{ github.event.inputs.service }}"
            if [ "$SELECTED" = "all" ]; then
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "services=[\"web\",\"cart\",\"catalogue\",\"user\",\"shipping\",\"payment\",\"ratings\",\"dispatch\"]" >> $GITHUB_OUTPUT
              echo " Chạy toàn bộ 8 microservices cốt lõi!"
            else
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "services=[\"$SELECTED\"]" >> $GITHUB_OUTPUT
              echo " Chỉ định chạy dịch vụ: $SELECTED"
            fi
            exit 0
          fi

          # Trường hợp Git Push tự động: So sánh diff với commit trước
          CHANGED_SERVICES=()
          for s in web cart catalogue user shipping payment ratings dispatch mongo mysql; do
            if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q "^${s}/"; then
              CHANGED_SERVICES+=("\"$s\"")
            fi
          done

          # Nếu thay đổi file cấu hình workflow ci-cd.yml, mặc định chạy service web để kiểm thử
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q "^\.github/workflows/ci-cd\.yml"; then
            if [ ${#CHANGED_SERVICES[@]} -eq 0 ]; then
              CHANGED_SERVICES+=("\"web\"")
            fi
          fi

          # Xuất kết quả ma trận JSON
          if [ ${#CHANGED_SERVICES[@]} -gt 0 ]; then
            SERVICES_JSON="["$(IFS=,; echo "${CHANGED_SERVICES[*]}")"]"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "services=$SERVICES_JSON" >> $GITHUB_OUTPUT
            echo " Các dịch vụ có thay đổi mã nguồn: $SERVICES_JSON"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "services=[]" >> $GITHUB_OUTPUT
            echo " Không có microservice nào thay đổi mã nguồn. Bỏ qua build."
          fi

  # =========================================================================
  # PHẦN 2: CHU TRÌNH 5 STAGE DEVSECOPS & GITOPS CHO TỪNG DỊCH VỤ
  # =========================================================================
  ci-cd-pipeline:
    name: "🚀 Pipeline: ${{ matrix.service }}"
    needs: [ detect-changes ]
    if: ${{ needs.detect-changes.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: 1.1. Checkout Mã nguồn
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 1.2. Thiết lập Biến Môi trường & Định danh Tag
        run: |
          SERVICE="${{ matrix.service }}"
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME || 'ducthinhahihi' }}"
          SHA_SHORT=$(echo ${GITHUB_SHA} | cut -c1-7)

          # Ánh xạ tên image và đường dẫn file Kubernetes manifest
          case "$SERVICE" in
            web)
              IMAGE_NAME="rs-web"
              MANIFEST="K8s/04-gateway/web.yaml"
              ;;
            mongo)
              IMAGE_NAME="rs-mongodb"
              MANIFEST="K8s/02-datastores/mongodb.yaml"
              ;;
            mysql)
              IMAGE_NAME="rs-mysql"
              MANIFEST="K8s/02-datastores/mysql.yaml"
              ;;
            *)
              IMAGE_NAME="rs-${SERVICE}"
              MANIFEST="K8s/03-microservices/${SERVICE}.yaml"
              ;;
          esac

          echo "SERVICE=${SERVICE}" >> $GITHUB_ENV
          echo "DOCKER_USER=${DOCKER_USER}" >> $GITHUB_ENV
          echo "SHA_SHORT=${SHA_SHORT}" >> $GITHUB_ENV
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "MANIFEST=${MANIFEST}" >> $GITHUB_ENV

          echo "========================================================="
          echo "Microservice: $SERVICE"
          echo "Image Name:   $IMAGE_NAME"
          echo "Tag:          $SHA_SHORT"
          echo "K8s Manifest: $MANIFEST"
          echo "Docker Hub:   $DOCKER_USER"
          echo "========================================================="

      # ---------------------------------------------------------------------
      # STAGE 1: CODE QUALITY & LINTING
      # ---------------------------------------------------------------------
      - name: "Stage 1: Lint Dockerfile & Shell Scripts"
        run: |
          echo "=== STAGE 1: KIỂM TRA CHẤT LƯỢNG MÃ NGUỒN ==="
          
          # Kiểm tra cú pháp tất cả file shell script trong thư mục service
          if compgen -G "${{ env.SERVICE }}/*.sh" > /dev/null; then
            for sh_file in ${{ env.SERVICE }}/*.sh; do
              echo "Checking syntax: $sh_file"
              bash -n "$sh_file"
            done
            echo " Toàn bộ shell script hợp lệ!"
          fi

          # Kiểm tra sự tồn tại của Dockerfile
          if [ -f "${{ env.SERVICE }}/Dockerfile" ]; then
            echo " Dockerfile tồn tại trong ${{ env.SERVICE }}/Dockerfile"
          else
            echo "❌ Không tìm thấy Dockerfile trong ${{ env.SERVICE }}"
            exit 1
          fi

      # ---------------------------------------------------------------------
      # STAGE 2: SECURITY & VULNERABILITY SCAN (DevSecOps - Trivy)
      # ---------------------------------------------------------------------
      - name: "Stage 2: Quét Lỗ Hổng Bảo Mật (Trivy DevSecOps)"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './${{ env.SERVICE }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # ---------------------------------------------------------------------
      # STAGE 3: BUILD LOCAL DOCKER IMAGE & TEST
      # ---------------------------------------------------------------------
      - name: "Stage 3: Đóng gói Docker Image Cục bộ"
        run: |
          echo "=== STAGE 3: ĐÓNG GÓI DOCKER IMAGE ==="
          echo "Đang build image cục bộ: ${{ env.IMAGE_NAME }}:${{ env.SHA_SHORT }}..."
          docker build -t ${{ env.IMAGE_NAME }}:${{ env.SHA_SHORT }} ./${{ env.SERVICE }}
          echo " Đóng gói ${{ env.IMAGE_NAME }}:${{ env.SHA_SHORT }} thành công!"

      # ---------------------------------------------------------------------
      # STAGE 4: PUBLISH TO REGISTRY (Docker Hub)
      # ---------------------------------------------------------------------
      - name: "Stage 4.1: Đăng nhập Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Stage 4.2: Đẩy Image lên Docker Hub"
        run: |
          echo "=== STAGE 4: PHÁT HÀNH IMAGE LÊN DOCKER HUB ==="
          FULL_IMAGE="${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}"
          
          echo "Gán tag và đẩy $FULL_IMAGE:${{ env.SHA_SHORT }}..."
          docker tag ${{ env.IMAGE_NAME }}:${{ env.SHA_SHORT }} ${FULL_IMAGE}:${{ env.SHA_SHORT }}
          docker tag ${{ env.IMAGE_NAME }}:${{ env.SHA_SHORT }} ${FULL_IMAGE}:latest
          
          docker push ${FULL_IMAGE}:${{ env.SHA_SHORT }}
          docker push ${FULL_IMAGE}:latest
          echo " Phát hành thành công lên Docker Hub: https://hub.docker.com/r/${FULL_IMAGE}"

      # ---------------------------------------------------------------------
      # STAGE 5: GITOPS HANDOFF & AUTO-SYNC
      # ---------------------------------------------------------------------
      - name: "Stage 5: Cập nhật Manifest K8s & Kích hoạt GitOps"
        run: |
          echo "=== STAGE 5: BÀN GIAO GITOPS CHO ARGOCD ==="
          FULL_IMAGE="${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}"
          MANIFEST_PATH="${{ env.MANIFEST }}"
          
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "❌ Không tìm thấy file manifest: $MANIFEST_PATH"
            exit 1
          fi

          # Tự động cập nhật thẻ image trong manifest K8s
          sed -i "s|image: .*${{ env.IMAGE_NAME }}:.*|image: ${FULL_IMAGE}:${{ env.SHA_SHORT }}|g" "$MANIFEST_PATH"
          echo " Đã cập nhật $MANIFEST_PATH trỏ về: ${FULL_IMAGE}:${{ env.SHA_SHORT }}"

          # Cấu hình bot và commit ngược lại kho Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST_PATH"
          
          if git diff --staged --quiet; then
            echo "Không có thay đổi trong manifest K8s (tag đã khớp)."
          else
            git commit -m "chore(gitops): auto-update ${{ env.IMAGE_NAME }} to ${{ env.SHA_SHORT }} [skip ci]"
            
            # Cơ chế Rebase Retry chống xung đột khi nhiều service build đồng thời
            MAX_RETRIES=5
            COUNT=0
            SUCCESS=0
            while [ $COUNT -lt $MAX_RETRIES ]; do
              git pull --rebase origin main
              if git push origin main; then
                SUCCESS=1
                break
              fi
              COUNT=$((COUNT+1))
              echo "Xung đột push đồng thời, thử lại lần $COUNT sau 2 giây..."
              sleep 2
            done

            if [ $SUCCESS -eq 1 ]; then
              echo " Đã commit & push Manifest K8s lên Git thành công! ArgoCD sẽ tự động kích hoạt Rolling Update."
            else
              echo "❌ Không thể push commit sau $MAX_RETRIES lần thử."
              exit 1
            fi
          fi
