[defaults]
# Chỉ định file inventory mặc định
inventory = inventory.ini

# Tắt hỏi xác nhận SSH key fingerprint khi kết nối lần đầu
host_key_checking = False

# Thời gian chờ kết nối SSH (giây)
timeout = 30

# Định dạng hiển thị log rõ ràng, dễ đọc (YAML callback)
stdout_callback = yaml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
