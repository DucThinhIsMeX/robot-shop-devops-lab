apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: robot-shop
  labels:
    app: user
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
    spec:
      containers:
      - name: user
        image: robotshop/rs-user:2.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: MONGO_URL
          valueFrom:
            configMapKeyRef:
              name: robot-shop-config
              key: USER_MONGO_URL
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: robot-shop-config
              key: REDIS_HOST
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          limits:
            cpu: 300m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: robot-shop
  labels:
    app: user
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: user

